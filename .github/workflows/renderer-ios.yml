name: RendererIOS validation

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tempest_profile:
        description: 'Pinned Tempest feature profile'
        required: true
        default: 'baseline'
        type: choice
        options:
          - baseline
          - direct-drawable
          - metalfx-spatial
          - metalfx-temporal
      fault_mode:
        description: 'One-shot RendererIOS diagnostics fault mode (ON build only)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - preview-attachment-missing
          - preview-readback-error
          - preview-fence-error-after-terminal
          - frame-fence-error-after-terminal
          - post-submit-suboptimal
          - shutdown-idle-unconfirmed-once
          - async-present-error-after-terminal
          - loader-thread-start-failure-once
      package_device_ipa:
        description: 'Package unsigned ON/OFF IPA artifacts for physical-device validation'
        required: true
        default: false
        type: boolean
      bink_self_test:
        description: 'Build the diagnostics-ON artifact with the synthetic Bink encode/readback gate (fault none only)'
        required: true
        default: false
        type: boolean
      resource_allocator_self_test:
        description: 'Build the diagnostics-ON artifact with the allocation-only Private/Memoryless resource gate (fault none, no Bink self-test)'
        required: true
        default: false
        type: boolean
      clear_only_pass_self_test:
        description: 'Build the diagnostics-ON artifact with the two-pass Private/Memoryless clear-only gate (fault none, no other self-test or pipeline archive)'
        required: true
        default: false
        type: boolean
      shading_prototype_tile_self_test:
        description: 'Build the diagnostics-ON artifact with the isolated shading prototype Tile encode/capture gate (fault none, no other self-test or pipeline archive)'
        required: true
        default: false
        type: boolean
      shading_prototype_forward_self_test:
        description: 'Build the diagnostics-ON artifact with the isolated Forward+ encode/readback/capture gate (fault none, no other self-test or pipeline archive)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: renderer-ios-${{ github.ref }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.tempest_profile || 'baseline' }}-${{ github.event_name == 'workflow_dispatch' && inputs.fault_mode || 'none' }}-${{ github.event_name == 'workflow_dispatch' && inputs.package_device_ipa && 'device-ipa' || 'build-only' }}
  cancel-in-progress: true

jobs:
  classifier:
    name: Classify required RendererIOS gates
    runs-on: macos-15
    outputs:
      classification: ${{ steps.route.outputs.classification }}
      contracts: ${{ steps.route.outputs.contracts }}
      build_off: ${{ steps.route.outputs.build_off }}
      build_on: ${{ steps.route.outputs.build_on }}
      build_tile: ${{ steps.route.outputs.build_tile }}
      build_forward: ${{ steps.route.outputs.build_forward }}
    steps:
      - name: Checkout full push history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify push before to SHA
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci_verification.py classify \
            --event-name "$EVENT_NAME" \
            --before "$EVENT_BEFORE" \
            --sha "$EVENT_SHA"
      - name: Verify fail-closed verification policy
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 \
            scripts/classify_verification.py --validate-policy
          PYTHONDONTWRITEBYTECODE=1 python3 \
            ios/tests/test_verification_classifier.py
          PYTHONDONTWRITEBYTECODE=1 python3 \
            ios/tests/test_verification_router.py
          PYTHONDONTWRITEBYTECODE=1 python3 \
            ios/tests/test_ci_verification.py

  contracts:
    name: RendererIOS contracts exactly once
    needs: classifier
    if: needs.classifier.result == 'success' && needs.classifier.outputs.contracts == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install contract prerequisites
        run: brew install cmake glslang ripgrep
      - name: Run all host, source, mutation, MSL and harness contracts once
        run: scripts/ci_contracts.command

  build-off:
    name: iOS Release diagnostics OFF
    needs: [classifier, contracts]
    if: needs.classifier.outputs.build_off == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install build prerequisites
        run: brew install cmake glslang ripgrep
      - name: Build and verify OFF self-contained
        env:
          IOS_VERSION: 1.0.${{ github.run_number }}
          TEMPEST_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.tempest_profile || 'baseline' }}
          PACKAGE_DEVICE_IPA: ${{ github.event_name == 'workflow_dispatch' && inputs.package_device_ipa && '1' || '0' }}
        run: scripts/ci_build_profile.command off
      - name: Upload unsigned OFF device-test IPA
        if: github.event_name == 'workflow_dispatch' && inputs.package_device_ipa
        uses: actions/upload-artifact@v4
        with:
          name: RendererIOS-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}-${{ inputs.tempest_profile }}-OFF-none-bink-self-test-false-resource-allocator-self-test-false-clear-only-pass-self-test-false-shading-prototype-tile-self-test-false-shading-prototype-forward-self-test-false
          path: device-artifact/
          if-no-files-found: error
          retention-days: 14

  build-on:
    name: iOS Release diagnostics ON
    needs: [classifier, contracts]
    if: needs.classifier.outputs.build_on == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install build prerequisites
        run: brew install cmake glslang ripgrep
      - name: Build and verify ON self-contained
        env:
          IOS_VERSION: 1.0.${{ github.run_number }}
          TEMPEST_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.tempest_profile || 'baseline' }}
          ACTIVE_FAULT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.fault_mode || 'none' }}
          BINK_SELF_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.bink_self_test && 'ON' || 'OFF' }}
          RESOURCE_ALLOCATOR_SELF_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.resource_allocator_self_test && 'ON' || 'OFF' }}
          CLEAR_ONLY_PASS_SELF_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.clear_only_pass_self_test && 'ON' || 'OFF' }}
          SHADING_PROTOTYPE_TILE_SELF_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.shading_prototype_tile_self_test && 'ON' || 'OFF' }}
          SHADING_PROTOTYPE_FORWARD_SELF_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.shading_prototype_forward_self_test && 'ON' || 'OFF' }}
          PACKAGE_DEVICE_IPA: ${{ github.event_name == 'workflow_dispatch' && inputs.package_device_ipa && '1' || '0' }}
        run: scripts/ci_build_profile.command on
      - name: Upload unsigned ON device-test IPA
        if: github.event_name == 'workflow_dispatch' && inputs.package_device_ipa
        uses: actions/upload-artifact@v4
        with:
          name: RendererIOS-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}-${{ inputs.tempest_profile }}-ON-${{ inputs.fault_mode }}-bink-self-test-${{ inputs.bink_self_test }}-resource-allocator-self-test-${{ inputs.resource_allocator_self_test }}-clear-only-pass-self-test-${{ inputs.clear_only_pass_self_test }}-shading-prototype-tile-self-test-${{ inputs.shading_prototype_tile_self_test }}-shading-prototype-forward-self-test-${{ inputs.shading_prototype_forward_self_test }}
          path: device-artifact/
          if-no-files-found: error
          retention-days: 14

  build-tile:
    name: iOS Release TILE self-test
    needs: [classifier, contracts]
    if: needs.classifier.outputs.build_tile == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install build prerequisites
        run: brew install cmake glslang ripgrep
      - name: Build and verify TILE self-contained
        env:
          IOS_VERSION: 1.0.${{ github.run_number }}
        run: scripts/ci_build_profile.command tile

  build-forward:
    name: iOS Release FORWARD self-test
    needs: [classifier, contracts]
    if: needs.classifier.outputs.build_forward == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install build prerequisites
        run: brew install cmake glslang ripgrep
      - name: Build and verify FORWARD self-contained
        env:
          IOS_VERSION: 1.0.${{ github.run_number }}
        run: scripts/ci_build_profile.command forward

  required:
    name: RendererIOS required gates
    needs: [classifier, contracts, build-off, build-on, build-tile, build-forward]
    if: always()
    runs-on: macos-15
    steps:
      - name: Checkout aggregator
        uses: actions/checkout@v4
      - name: Reject missing, skipped or failed required gates
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci_verification.py aggregate \
            --classifier-result "${{ needs.classifier.result }}" \
            --expected-contracts "${{ needs.classifier.outputs.contracts }}" \
            --result-contracts "${{ needs.contracts.result }}" \
            --expected-build-off "${{ needs.classifier.outputs.build_off }}" \
            --result-build-off "${{ needs.build-off.result }}" \
            --expected-build-on "${{ needs.classifier.outputs.build_on }}" \
            --result-build-on "${{ needs.build-on.result }}" \
            --expected-build-tile "${{ needs.classifier.outputs.build_tile }}" \
            --result-build-tile "${{ needs.build-tile.result }}" \
            --expected-build-forward "${{ needs.classifier.outputs.build_forward }}" \
            --result-build-forward "${{ needs.build-forward.result }}"
